bundle-name: "HybridAKS D16s_v3 vmskus tests"
bundle-owners:
- rjainiteam
services:
- hybridaks-cli
platform: all
modes:
- daily-skuD16v3
providers:
- "azurestackhci"
tests:
- name: "Create ARC VM Network"
  steps:
  - resource-type: LogicalNetwork
    resource-name: d16
    actions:
    - action: Create
      config:
        vmswitch-name: "{{SWITCHNAME}}"
        address-allocation: Static
        address-prefix: "{{address-prefix}}"
        gateway: "{{gateway}}"
        dnsservers: ["{{dnsservers}}"]
        vlan: {{vlan}}
        vmpoolstart: "{{vmpoolstart}}"
        vmpoolend: "{{vmpoolend}}"
    add-for-cleanup: false

- name: "HybridAKS Cluster create with ARC VM Network and D16s_v3 sku"
  steps:
  - resource-type: HybridAKSCluster
    resource-name: ds16
    add-for-cleanup: false
    actions:
    - action: Create
      config:
        arcvm-lnet-names:
        - d16
        hybridaksclusters:
          properties:
            kubernetesVersionIndex: 2
            controlPlane:
              count: 1
              vmSize: Standard_A4_v2
              controlPlaneEndpoint:
                hostIP: $TargetClusterDHCPControlPlaneEndpoint
            networkProfile:
              loadBalancerProfile:
                count: 0
            agentPoolProfiles:
              - osType: Linux
                osSKU: CBLMariner
                count: 1
                vmSize: Standard_D16s_v3
      create-prerequisites: false
    - action: Get
      validations:
        - method: statusObject
          expected-status-object:
            properties:
              kubernetesVersionIndex: 2
              agentPoolProfiles:
              - osType: Linux
                count: 1
                vmSize: Standard_D16s_v3
              controlPlane:
                count: 1
                vmSize: Standard_A4_v2
              networkProfile:
                loadBalancerProfile:
                  count: 0
                networkPolicy: calico
              provisioningState: Succeeded

- name: "HybridAKS Cluster Update controlplane, Upgrade to new K8s version"
  steps:
  - resource-type: HybridAKSCluster
    resource-name: ds16
    actions:
    - action: Update
      config:
        arcvm-lnet-names:
        - d16
        hybridaksclusters:
          properties:
            kubernetesVersionIndex: 2
            controlPlane:
              count: 3
              vmSize: Standard_A4_v2
              controlPlaneEndpoint:
                hostIP: $TargetClusterDHCPControlPlaneEndpoint
            networkProfile:
              loadBalancerProfile:
                count: 0
      create-prerequisites: false
    - action: Get
      validations:
        - method: statusObject
          expected-status-object:
            properties:
              kubernetesVersionIndex: 2
              controlPlane:
                count: 3
                vmSize: Standard_A4_v2
              networkProfile:
                loadBalancerProfile:
                  count: 0
                networkPolicy: calico
              provisioningState: Succeeded

    - action: Update
      config:
        arcvm-lnet-names:
        - d16
        hybridaksclusters:
          properties:
            kubernetesVersionIndex: 2
            controlPlane:
              count: 1
              vmSize: Standard_A4_v2
              controlPlaneEndpoint:
                hostIP: $TargetClusterDHCPControlPlaneEndpoint
            networkProfile:
              loadBalancerProfile:
                count: 0
      create-prerequisites: false
    - action: Get
      validations:
        - method: statusObject
          expected-status-object:
            properties:
              kubernetesVersionIndex: 2
              controlPlane:
                count: 1
                vmSize: Standard_A4_v2
              networkProfile:
                loadBalancerProfile:
                  count: 0
                networkPolicy: calico
              provisioningState: Succeeded

    - action: Upgrade
      config:
        arcvm-lnet-names:
        - d16
        hybridaksclusters:
          properties:
            kubernetesVersionIndex: 4
            controlPlane:
              count: 1
              vmSize: Standard_A4_v2
              controlPlaneEndpoint:
                hostIP: $TargetClusterDHCPControlPlaneEndpoint
            networkProfile:
              loadBalancerProfile:
                count: 0
      create-prerequisites: false
    - action: Get
      validations:
        - method: statusObject
          expected-status-object:
            properties:
              controlPlane:
                count: 1
                vmSize: Standard_A4_v2
              networkProfile:
                loadBalancerProfile:
                  count: 0
                networkPolicy: calico
              provisioningState: Succeeded
              kubernetesVersionIndex: 4

- name: "HybridAKS NodePool create D16s_v3 with single node"
  steps:
  - resource-type: HybridAKSNodePool
    resource-name: dn1
    actions:
    - action: Create
      config:
        arcvm-lnet-names:
        - d16
        hybridaks-cluster-name: ds16
        hybridaksagentpool:
          properties:
            count: 1
            vmSize: Standard_D16s_v3
            osType: Linux
    - action: Get
      config:
        hybridaks-cluster-name: ds16
      validations:
        - method: exists
          expected-value:
          - "true"
        - method: statusObject
          expected-status-object:
            properties:
              count: 1
              vmSize: Standard_D16s_v3
              osType: Linux

- name: "HybridAKS NodePool Vertical Scale (Up/Down)"
  steps:
  - resource-type: HybridAKSNodePool
    resource-name: dn1
    actions:
    - action: Update
      config:
        arcvm-lnet-names:
        - d16
        hybridaks-cluster-name: ds16
        hybridaksagentpool:
          properties:
            count: 1
            vmSize: Standard_D8s_v3
            osType: Linux
    - action: Get
      config:
        hybridaks-cluster-name: ds16
      validations:
        - method: exists
          expected-value:
          - "true"
        - method: statusObject
          expected-status-object:
            properties:
              count: 1
              vmSize: Standard_D8s_v3
              osType: Linux
    - action: Update
      config:
        arcvm-lnet-names:
        - d16
        hybridaks-cluster-name: ds16
        hybridaksagentpool:
          properties:
            count: 1
            vmSize: Standard_D16s_v3
            osType: Linux
    - action: Get
      config:
        hybridaks-cluster-name: ds16
      validations:
        - method: exists
          expected-value:
          - "true"
        - method: statusObject
          expected-status-object:
            properties:
              count: 1
              vmSize: Standard_D16s_v3
              osType: Linux
        - method: targetClusterValidationNodepoolLabelTaint

- name: "HybridAKS NodePool Horizontal Scale (Out/In)"
  steps:
  - resource-type: HybridAKSNodePool
    resource-name: dn1
    actions:
    - action: Update
      config:
        arcvm-lnet-names:
        - d16
        hybridaks-cluster-name: ds16
        hybridaksagentpool:
          properties:
            count: 2
            vmSize: Standard_D16s_v3
            osType: Linux
    - action: Get
      config:
        hybridaks-cluster-name: ds16
      validations:
        - method: exists
          expected-value:
          - "true"
        - method: statusObject
          expected-status-object:
            properties:
              count: 2
              vmSize: Standard_D16s_v3
              osType: Linux
    - action: Update
      config:
        arcvm-lnet-names:
        - d16
        hybridaks-cluster-name: ds16
        hybridaksagentpool:
          properties:
            count: 1
            vmSize: Standard_D16s_v3
            osType: Linux
    - action: Get
      config:
        hybridaks-cluster-name: ds16
      validations:
        - method: exists
          expected-value:
          - "true"
        - method: statusObject
          expected-status-object:
            properties:
              count: 1
              vmSize: Standard_D16s_v3
              osType: Linux
        - method: targetClusterValidationNodepoolLabelTaint

    - action: Delete
      config:
        hybridaks-cluster-name: ds16
    - action: Get
      config:
        hybridaks-cluster-name: ds16
      validations:
        - method: exists
          expected-value:
          - "false"
      expected-error: NotFound

- name: "HybridAKS cluster delete"
  steps:
  - resource-type: HybridAKSCluster
    resource-name: ds16
    actions:
    - action: Delete
    - action: Get
      validations:
        - method: exists
          expected-value:
          - "false"
      expected-error: NotFound
    add-for-cleanup: true

- name: "HybridAKS Cluster create with unstacked-haproxy(Load Balancer Sku)"
  steps:
  - resource-type: HybridAKSCluster
    resource-name: ds16
    actions:
    - action: Create
      config:
        arcvm-lnet-names:
        - d16
        hybridaksclusters:
          properties:
            kubernetesVersionIndex: 2
            controlPlane:
              count: 1
              controlPlaneEndpoint: 
                hostIP: $TargetClusterDHCPControlPlaneEndpoint
    - action: Get
      validations:
        - method: exists
          expected-value:
          - "true"
        - method: statusObject
          expected-status-object:
            properties:
              controlPlane:
                count: 1
              provisioningState: Succeeded

- name: "HybridAKS NodePool create D16s_v3 with single node"
  steps:
  - resource-type: HybridAKSNodePool
    resource-name: dn2
    actions:
    - action: Create
      config:
        arcvm-lnet-names:
        - d16
        hybridaks-cluster-name: ds16
        hybridaksagentpool:
          properties:
            count: 1
            vmSize: Standard_D16s_v3
            osType: Linux
    - action: Get
      config:
        hybridaks-cluster-name: ds16
      validations:
        - method: exists
          expected-value:
          - "true"
        - method: statusObject
          expected-status-object:
            properties:
              count: 1
              vmSize: Standard_D16s_v3
              osType: Linux

- name: "HybridAKS cluster delete"
  bundleCleanupStep: true
  steps:
  - resource-type: HybridAKSCluster
    resource-name: ds16
    actions:
    - action: Delete
    - action: Get
      validations:
        - method: exists
          expected-value:
          - "false"
      expected-error: NotFound
    add-for-cleanup: true

- name: "Delete ARC VM Network"
  bundleCleanupStep: true
  steps:
  - resource-type: LogicalNetwork
    resource-name: d16
    actions:
    - action: Delete
    add-for-cleanup: true
