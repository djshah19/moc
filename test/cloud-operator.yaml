      - effect: NoSchedule
        key: node-role.kubernetes.io/master
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
      volumes:
      - hostPath:
          path: /etc/pki/tls/certs
          type: DirectoryOrCreate
        name: proxy-certstore-dir
      - hostPath:
          path: /etc/pki/tls/certs/ca-bundle.crt
