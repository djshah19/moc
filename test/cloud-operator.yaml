        resources:
          limits:
            memory: 500Mi
          requests:
            memory: 250Mi
        volumeMounts:
        - mountPath: /etc/ssl/certs
          name: proxy-certstore-dir
          readOnly: false
        - mountPath: /etc/ssl/certs/ca-certificates.crt
          name: proxy-certstore
          readOnly: true
        - mountPath: /etc/azhci/cloudconfig
          name: cloudconfig
          readOnly: false
      imagePullSecrets:
      - name: regcred
