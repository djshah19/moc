---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    control-plane: controller-manager
  name: cloudop-controller-manager
  namespace: cloudop-system
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --container-registry=ecpacr.azurecr.io
        - --diagnostics-address=127.0.0.1:8080
        - --enable-leader-election
        command:
        - /app/manager
        env:
        - name: http_proxy
          valueFrom:
            secretKeyRef:
              key: http.proxy
              name: network-proxy
        - name: https_proxy
          valueFrom:
            secretKeyRef:
              key: https.proxy
              name: network-proxy
        - name: no_proxy
          valueFrom:
            secretKeyRef:
              key: no.proxy
              name: network-proxy
        - name: WSSD_CONFIG_PATH
          value: /etc/azhci/cloudconfig/value
        - name: DOCKER_CONFIG
          value: /app/.docker
        - name: XDG_CONFIG_HOME
          value: /app/.config
        - name: HELM_CONFIG_HOME
          value: /app/.config
